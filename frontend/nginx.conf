server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 上传体量上限：真实 PDF（如 NIST 报告 1.9MB）需要 > 默认 1MB
    client_max_body_size 50m;

    # SPA 路由回退（刷新非根路径不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # pdf.js worker 为动态 import 的 .mjs；某些 nginx 镜像 mime.types 缺映射，
    # 会以 application/octet-stream 返回导致 module script 被浏览器拒绝（PDF 渲染失败）
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    # 反向代理 API 到后端容器；关闭缓冲以保证 SSE 流式（/api/v1/chat）实时性
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 服务端注入租户/用户身份（浏览器无法覆盖）：后端 ACL 与审计依赖此头
        proxy_set_header X-Rag-Tenant "default";
        proxy_set_header X-Rag-User "demo";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
