# DocRAG 一键部署（零外部服务依赖）。
#
# 默认以 MOCK 后端启动，可完全离线端到端演示（无需下载大模型权重）。
# 切换到真实模型：将下方 RAG_*_MOCK 全部改为 "false"，
# 并为 backend 挂载模型权重（volume docrag_models）或允许运行时自动拉取。
#
# 启动：  docker compose up --build
# 访问：  http://localhost:3002   （前端，API 经 nginx 反代到 backend；3000 常被占用故用 3002）
# 后端：  http://localhost:3002/api/v1/health

services:
  backend:
    build: ./backend
    environment:
      RAG_DATA_DIR: /data
      RAG_DB_PATH: /data/app.db
      RAG_MODEL_DIR: /models
      RAG_LLM_MOCK: "true"
      RAG_EMBED_MOCK: "true"
      RAG_RERANK_MOCK: "true"
      RAG_PARSE_MOCK: "true"
      RAG_PORT: "8000"
    volumes:
      - docrag_data:/data
      - docrag_models:/models
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3002:80"
    restart: unless-stopped

volumes:
  docrag_data:
  docrag_models:
