name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-eval.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q
      - run: python -m ruff check app --select F401,F811,F841,E9,F63,F7

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  evaluation-gate:
    name: 评测门禁（public_nist）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 缓存评测工作目录（NIST PDF 与语料）
        uses: actions/cache@v4
        with:
          path: work
          key: docrag-eval-${{ hashFiles('backend/app/evaluation/datasets/**') }}
      - name: 运行评测门禁
        run: bash scripts/evaluation/gate.sh
